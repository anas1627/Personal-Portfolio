<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="100%" stop-color="#241a1a" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg4)"/>
  <circle cx="500" cy="100" r="110" fill="#ff004f" opacity="0.1" filter="blur(40px)"/>
  
  <g filter="url(#shadow4)">
    <!-- Centered Calculator Device -->
    <rect x="180" y="30" width="240" height="340" rx="20" fill="#1b1b22" stroke="#333340" stroke-width="2"/>

    <!-- Display Screen -->
    <rect x="200" y="55" width="200" height="65" rx="10" fill="#0d0d12" stroke="#252530" stroke-width="1"/>
    <text x="385" y="80" fill="#7a7a8c" font-family="'Courier New', monospace" font-size="12" text-anchor="end">256 x 42 + 8.12</text>
    <text x="385" y="108" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="end">10,760.12</text>

    <!-- Keypad Grid -->
    <!-- Row 1 -->
    <rect x="200" y="135" width="42" height="36" rx="8" fill="#2a2a36"/>
    <text x="221" y="158" fill="#ff004f" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AC</text>

    <rect x="252" y="135" width="42" height="36" rx="8" fill="#2a2a36"/>
    <text x="273" y="158" fill="#ff004f" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">C</text>

    <rect x="305" y="135" width="42" height="36" rx="8" fill="#2a2a36"/>
    <text x="326" y="158" fill="#ff004f" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">%</text>

    <rect x="358" y="135" width="42" height="36" rx="8" fill="#ff004f"/>
    <text x="379" y="158" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="200" y="180" width="42" height="36" rx="8" fill="#252530"/>
    <text x="221" y="203" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">7</text>

    <rect x="252" y="180" width="42" height="36" rx="8" fill="#252530"/>
    <text x="273" y="203" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">8</text>

    <rect x="305" y="180" width="42" height="36" rx="8" fill="#252530"/>
    <text x="326" y="203" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">9</text>

    <rect x="358" y="180" width="42" height="36" rx="8" fill="#ff004f"/>
    <text x="379" y="203" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">×</text>

    <!-- Row 3 -->
    <rect x="200" y="225" width="42" height="36" rx="8" fill="#252530"/>
    <text x="221" y="248" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">4</text>

    <rect x="252" y="225" width="42" height="36" rx="8" fill="#252530"/>
    <text x="273" y="248" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">5</text>

