    <text x="326" y="248" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">6</text>

    <rect x="358" y="225" width="42" height="36" rx="8" fill="#ff004f"/>
    <text x="379" y="248" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">−</text>

    <!-- Row 4 -->
    <rect x="200" y="270" width="42" height="36" rx="8" fill="#252530"/>
    <text x="221" y="293" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">1</text>

    <rect x="252" y="270" width="42" height="36" rx="8" fill="#252530"/>
    <text x="273" y="293" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">2</text>

    <rect x="305" y="270" width="42" height="36" rx="8" fill="#252530"/>
    <text x="326" y="293" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">3</text>

    <rect x="358" y="270" width="42" height="36" rx="8" fill="#ff004f"/>
    <text x="379" y="293" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">+</text>

    <!-- Row 5 -->
    <rect x="200" y="315" width="94" height="36" rx="8" fill="#252530"/>
    <text x="247" y="338" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">0</text>

    <rect x="305" y="315" width="42" height="36" rx="8" fill="#252530"/>
    <text x="326" y="338" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">.</text>

    <rect x="358" y="315" width="42" height="36" rx="8" fill="#27c93f"/>
    <text x="379" y="338" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>
