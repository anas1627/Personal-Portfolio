<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#1f1019" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg6)"/>
  <circle cx="500" cy="80" r="100" fill="#ff004f" opacity="0.12" filter="blur(40px)"/>

  <g filter="url(#shadow6)">
    <rect x="40" y="35" width="520" height="330" rx="12" fill="#141416" stroke="#2c2c36" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect x="40" y="35" width="520" height="38" rx="12" fill="#1d1d24"/>
    <circle cx="62" cy="54" r="5" fill="#ff5f56"/>
    <circle cx="78" cy="54" r="5" fill="#ffbd2e"/>
    <circle cx="94" cy="54" r="5" fill="#27c93f"/>

    <text x="120" y="58" fill="#888899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">mohammed-anas.dev</text>

    <!-- Nav in mockup -->
    <text x="350" y="58" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Home</text>
    <text x="395" y="58" fill="#aaaab8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">About</text>
    <text x="440" y="58" fill="#aaaab8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Work</text>
    <text x="485" y="58" fill="#aaaab8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Contact</text>

    <!-- Hero layout -->
    <text x="70" y="125" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">FULL STACK DEVELOPER</text>
    <text x="70" y="160" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">Hi, I'm Mohammed Anas</text>
    <text x="70" y="185" fill="#888899" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Rajalakshmi Institute of Technology • CGPA 8.12</text>

    <!-- Code Block element -->
    <rect x="70" y="210" width="280" height="130" rx="8" fill="#0d0d10" stroke="#25252e" stroke-width="1"/>
    <text x="85" y="235" fill="#e06c75" font-family="'Courier New', monospace" font-size="11">const <tspan fill="#61afef">developer</tspan> = {</text>
    <text x="100" y="255" fill="#abb2bf" font-family="'Courier New', monospace" font-size="11">name: <tspan fill="#98c379">'Mohammed Anas M H'</tspan>,</text>
    <text x="100" y="275" fill="#abb2bf" font-family="'Courier New', monospace" font-size="11">skills: [<tspan fill="#98c379">'C'</tspan>, <tspan fill="#98c379">'Python'</tspan>, <tspan fill="#98c379">'Java'</tspan>, <tspan fill="#98c379">'SQL'</tspan>],</text>
    <text x="100" y="295" fill="#abb2bf" font-family="'Courier New', monospace" font-size="11">role: <tspan fill="#98c379">'Full Stack Developer'</tspan></text>
    <text x="85" y="315" fill="#e06c75" font-family="'Courier New', monospace" font-size="11">};</text>

    <!-- Profile Card on the right -->
    <rect x="380" y="115" width="150" height="225" rx="10" fill="#1a1a22" stroke="#2e2e3a" stroke-width="1"/>
    <circle cx="455" cy="170" r="35" fill="#252532" stroke="#ff004f" stroke-width="2"/>
    <text x="455" y="177" fill="#ff004f" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" text-anchor="middle">MA</text>
    
    <text x="455" y="225" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Anas M H</text>
    <text x="455" y="242" fill="#888899" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Chennai, India</text>
    <rect x="405" y="265" width="100" height="26" rx="13" fill="#ff004f"/>
    <text x="455" y="282" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Hire Me</text>
  </g>
</svg>
