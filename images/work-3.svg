<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#14282e" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff004f" />
      <stop offset="50%" stop-color="#ffbd2e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg3)"/>
  <circle cx="480" cy="90" r="110" fill="#00f2fe" opacity="0.08" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="100" fill="#ff004f" opacity="0.1" filter="blur(30px)"/>

  <!-- Window Container -->
  <g filter="url(#shadow3)">
    <rect x="40" y="35" width="520" height="330" rx="12" fill="#151b22" stroke="#25323d" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect x="40" y="35" width="520" height="38" rx="12" fill="#1c2430"/>
    <rect x="40" y="60" width="520" height="13" fill="#1c2430"/>
    <circle cx="62" cy="54" r="5" fill="#ff5f56"/>
    <circle cx="78" cy="54" r="5" fill="#ffbd2e"/>
    <circle cx="94" cy="54" r="5" fill="#27c93f"/>

    <text x="120" y="58" fill="#7a8c9e" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">cgpa-calculator.web.app</text>

    <!-- Header title inside app -->
    <!-- Two Column layout inside -->
    <!-- Left Column: Grade Inputs -->
    <rect x="65" y="90" width="240" height="255" rx="8" fill="#19212c" stroke="#2a394a" stroke-width="1"/>
    <text x="80" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Course Grade Entry</text>

    <!-- Subject Row 1 -->
    <rect x="80" y="130" width="130" height="30" rx="4" fill="#222d3b"/>
    <text x="90" y="150" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Data Structures</text>
    <rect x="220" y="130" width="70" height="30" rx="4" fill="#ff004f" opacity="0.2"/>
    <text x="255" y="150" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">O (10)</text>

    <!-- Subject Row 2 -->
    <rect x="80" y="170" width="130" height="30" rx="4" fill="#222d3b"/>
    <text x="90" y="190" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">OOP with Java</text>
    <rect x="220" y="170" width="70" height="30" rx="4" fill="#ff004f" opacity="0.2"/>
    <text x="255" y="190" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A+ (9)</text>

    <!-- Subject Row 3 -->
    <rect x="80" y="210" width="130" height="30" rx="4" fill="#222d3b"/>
    <text x="90" y="230" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Python Programming</text>
    <rect x="220" y="210" width="70" height="30" rx="4" fill="#ff004f" opacity="0.2"/>
    <text x="255" y="230" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A+ (9)</text>

    <!-- Calculate Button -->
    <rect x="80" y="260" width="210" height="36" rx="6" fill="#ff004f"/>
    <text x="185" y="283" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Calculate SGPA &amp; CGPA</text>

    <!-- Right Column: Result Dial & Target Tracker -->
    <rect x="325" y="90" width="215" height="255" rx="8" fill="#19212c" stroke="#2a394a" stroke-width="1"/>
    <text x="345" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Calculated Results</text>

    <!-- Circular Dial -->
    <circle cx="432" cy="180" r="50" fill="none" stroke="#222d3b" stroke-width="10"/>
    <circle cx="432" cy="180" r="50" fill="none" stroke="#ff004f" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="60" stroke-linecap="round"/>
    <text x="432" y="182" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">8.12</text>
    <text x="432" y="200" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CGPA / 10.0</text>

    <!-- SGPA and Stats badge -->
    <rect x="345" y="250" width="80" height="40" rx="6" fill="#222d3b"/>
    <text x="385" y="267" fill="#7a8c9e" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">SEMESTER</text>
    <text x="385" y="282" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">8.45</text>

    <rect x="440" y="250" width="85" height="40" rx="6" fill="#222d3b"/>
    <text x="482" y="267" fill="#7a8c9e" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">STATUS</text>
    <text x="482" y="282" fill="#27c93f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Distinction</text>

    <text x="432" y="325" fill="#8899aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">Rajalakshmi Institute of Technology</text>
  </g>
</svg>
