<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#191932" />
    </linearGradient>
    <linearGradient id="gradAccent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff004f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg2)"/>

  <!-- Glowing background elements -->
  <circle cx="500" cy="320" r="130" fill="#7928ca" opacity="0.12" filter="blur(50px)"/>
  <circle cx="120" cy="80" r="100" fill="#ff004f" opacity="0.1" filter="blur(40px)"/>

  <!-- Browser Container -->
  <g filter="url(#shadow2)">
    <rect x="40" y="35" width="520" height="330" rx="12" fill="#151726" stroke="#2c2f4a" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect x="40" y="35" width="520" height="38" rx="12" fill="#1c2035"/>
    <rect x="40" y="60" width="520" height="13" fill="#1c2035"/>
    <circle cx="62" cy="54" r="5" fill="#ff5f56"/>
    <circle cx="78" cy="54" r="5" fill="#ffbd2e"/>
    <circle cx="94" cy="54" r="5" fill="#27c93f"/>

    <text x="120" y="58" fill="#8d94ba" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">campus-os.edu/portal/academic</text>

    <!-- Student Avatar + Info in bar -->
    <circle cx="525" cy="54" r="12" fill="#ff004f"/>
    <text x="525" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">MA</text>

    <!-- Dashboard Content -->
    <!-- Top Greeting Banner -->
    <rect x="60" y="90" width="480" height="70" rx="10" fill="url(#gradAccent2)"/>
    <text x="80" y="118" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Welcome Back, Mohammed Anas!</text>
    <text x="80" y="138" fill="#f0d5e8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">B.E. Computer &amp; Communication Engg | Semester IV | CGPA: 8.12</text>

    <!-- Course Modules & Schedule Cards -->
    <rect x="60" y="175" width="150" height="170" rx="8" fill="#1a1e33" stroke="#2d3356" stroke-width="1"/>
    <text x="75" y="200" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Enrolled Courses</text>
    
    <rect x="72" y="215" width="126" height="28" rx="5" fill="#232845"/>
    <text x="80" y="233" fill="#d0d5f5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Database Systems (SQL)</text>

    <rect x="72" y="250" width="126" height="28" rx="5" fill="#232845"/>
    <text x="80" y="268" fill="#d0d5f5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Web Technologies</text>

    <rect x="72" y="285" width="126" height="28" rx="5" fill="#232845"/>
    <text x="80" y="303" fill="#d0d5f5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Python &amp; Java Lab</text>

    <!-- Timetable / Attendance widget -->
    <rect x="225" y="175" width="150" height="170" rx="8" fill="#1a1e33" stroke="#2d3356" stroke-width="1"/>
    <text x="240" y="200" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Attendance Tracker</text>
    <circle cx="300" cy="255" r="38" fill="none" stroke="#2a3052" stroke-width="8"/>
    <circle cx="300" cy="255" r="38" fill="none" stroke="#ff004f" stroke-width="8" stroke-dasharray="238" stroke-dashoffset="35" stroke-linecap="round"/>
    <text x="300" y="259" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">91%</text>
    <text x="300" y="318" fill="#a0a8cf" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Present in all core labs</text>

    <!-- Notices / Academic Feed -->
    <rect x="390" y="175" width="150" height="170" rx="8" fill="#1a1e33" stroke="#2d3356" stroke-width="1"/>
    <text x="405" y="200" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Campus Notices</text>
    
    <rect x="402" y="215" width="126" height="38" rx="5" fill="#232845"/>
    <text x="410" y="230" fill="#ff004f" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">HACKATHON ALERT</text>
    <text x="410" y="244" fill="#bac1e8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">SIMATS Hackathon Team</text>

    <rect x="402" y="260" width="126" height="38" rx="5" fill="#232845"/>
    <text x="410" y="275" fill="#27c93f" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">EXAM SCHEDULE</text>
    <text x="410" y="289" fill="#bac1e8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">Sem End Practicals Out</text>
  </g>
</svg>
